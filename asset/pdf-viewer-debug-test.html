<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .test-iframe { width: 100%; height: 600px; border: 1px solid #333; }
        .debug-output { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; font-family: monospace; white-space: pre-wrap; }
        .button { padding: 8px 16px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .button:hover { background: #005a87; }
        .status { padding: 5px 10px; margin: 5px; border-radius: 3px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.warning { background: #fff3cd; color: #856404; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>PDF Viewer Debug Test</h1>
    <p>This page helps test and debug the custom PDF.js viewer implementation for hiding download buttons.</p>
    
    <div class="test-section">
        <h2>Test Configuration</h2>
        <p><strong>Browser:</strong> <span id="browser-info"></span></p>
        <p><strong>User Agent:</strong> <span id="user-agent"></span></p>
        <p><strong>Test PDF:</strong> <span id="test-pdf-url"></span></p>
        
        <button class="button" onclick="loadTestPDF()">Load Test PDF</button>
        <button class="button" onclick="clearDebugLog()">Clear Debug Log</button>
        <button class="button" onclick="inspectIframe()">Inspect Iframe Content</button>
    </div>
    
    <div class="test-section">
        <h2>Debug Output</h2>
        <div id="debug-log" class="debug-output">Debug output will appear here...</div>
    </div>
    
    <div class="test-section">
        <h2>PDF Viewer Test</h2>
        <div id="viewer-status" class="status">Ready to load PDF...</div>
        <iframe id="test-iframe" class="test-iframe" src="about:blank"></iframe>
    </div>
    
    <script>
        // Debug logging
        const debugLog = document.getElementById('debug-log');
        const originalConsoleLog = console.log;
        const originalConsoleWarn = console.warn;
        const originalConsoleError = console.error;
        
        function addToDebugLog(level, ...args) {
            const timestamp = new Date().toISOString().substr(11, 12);
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
            debugLog.textContent += `[${timestamp}] ${level.toUpperCase()}: ${message}\n`;
            debugLog.scrollTop = debugLog.scrollHeight;
        }
        
        console.log = function(...args) {
            addToDebugLog('log', ...args);
            originalConsoleLog.apply(console, args);
        };
        
        console.warn = function(...args) {
            addToDebugLog('warn', ...args);
            originalConsoleWarn.apply(console, args);
        };
        
        console.error = function(...args) {
            addToDebugLog('error', ...args);
            originalConsoleError.apply(console, args);
        };
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Detect browser
            const userAgent = navigator.userAgent;
            const isFirefox = userAgent.includes('Firefox');
            const isChrome = userAgent.includes('Chrome');
            const isSafari = userAgent.includes('Safari') && !userAgent.includes('Chrome');
            
            let browserName = 'Unknown';
            if (isFirefox) browserName = 'Firefox';
            else if (isChrome) browserName = 'Chrome';
            else if (isSafari) browserName = 'Safari';
            
            document.getElementById('browser-info').textContent = browserName;
            document.getElementById('user-agent').textContent = userAgent;
            
            // Set test PDF URL (use the compressed test PDF from pdf.js)
            const testPdfUrl = './pdfjs/web/compressed.tracemonkey-pldi-09.pdf';
            document.getElementById('test-pdf-url').textContent = testPdfUrl;
            
            console.log('PDF Viewer Debug Test initialized');
            console.log('Browser:', browserName);
            console.log('Firefox detected:', isFirefox);
        });
        
        function loadTestPDF() {
            const iframe = document.getElementById('test-iframe');
            const status = document.getElementById('viewer-status');
            
            // Build the custom viewer URL
            const testPdfUrl = './pdfjs/web/compressed.tracemonkey-pldi-09.pdf';
            const viewerUrl = `./pdf-custom-viewer.html?file=${encodeURIComponent(testPdfUrl)}&hideDownloads=1`;
            
            console.log('Loading PDF viewer:', viewerUrl);
            status.className = 'status warning';
            status.textContent = 'Loading PDF viewer...';
            
            iframe.src = viewerUrl;
            
            iframe.onload = function() {
                console.log('PDF viewer iframe loaded');
                status.className = 'status success';
                status.textContent = 'PDF viewer loaded successfully';
                
                // Monitor for console messages from the iframe
                setTimeout(() => {
                    try {
                        const iframeWindow = iframe.contentWindow;
                        if (iframeWindow) {
                            console.log('Iframe window accessible, monitoring for messages...');
                        }
                    } catch (e) {
                        console.warn('Cannot access iframe window (cross-origin):', e.message);
                    }
                }, 1000);
            };
            
            iframe.onerror = function() {
                console.error('Failed to load PDF viewer');
                status.className = 'status error';
                status.textContent = 'Failed to load PDF viewer';
            };
        }
        
        function clearDebugLog() {
            debugLog.textContent = 'Debug log cleared...\n';
        }
        
        function inspectIframe() {
            const iframe = document.getElementById('test-iframe');
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc) {
                    console.warn('Cannot access iframe document');
                    return;
                }
                
                console.log('=== IFRAME INSPECTION ===');
                
                // Check for download buttons
                const downloadButtons = doc.querySelectorAll('#downloadButton, #secondaryDownload, button[data-l10n-id="pdfjs-save-button"]');
                console.log('Download buttons found:', downloadButtons.length);
                downloadButtons.forEach((btn, i) => {
                    console.log(`Button ${i + 1}:`, {
                        id: btn.id,
                        className: btn.className,
                        visible: btn.offsetWidth > 0 && btn.offsetHeight > 0,
                        display: getComputedStyle(btn).display,
                        visibility: getComputedStyle(btn).visibility,
                        opacity: getComputedStyle(btn).opacity
                    });
                });
                
                // Check for print buttons
                const printButtons = doc.querySelectorAll('#printButton, #secondaryPrint, button[data-l10n-id="pdfjs-print-button"]');
                console.log('Print buttons found:', printButtons.length);
                
                // Check for any suspicious buttons
                const allButtons = doc.querySelectorAll('button, a');
                const suspiciousButtons = [];
                allButtons.forEach(btn => {
                    const text = (btn.textContent || '').toLowerCase();
                    const l10n = btn.getAttribute('data-l10n-id') || '';
                    if ((text.includes('save') || text.includes('download') || text.includes('print') ||
                         l10n.includes('save') || l10n.includes('download') || l10n.includes('print')) &&
                        btn.offsetWidth > 0 && btn.offsetHeight > 0) {
                        suspiciousButtons.push({
                            id: btn.id,
                            text: text.substring(0, 30),
                            l10n: l10n,
                            visible: true
                        });
                    }
                });
                
                if (suspiciousButtons.length > 0) {
                    console.warn('Suspicious visible buttons:', suspiciousButtons);
                } else {
                    console.log('No suspicious visible buttons found');
                }
                
                console.log('=== END INSPECTION ===');
                
            } catch (e) {
                console.error('Cannot inspect iframe:', e.message);
            }
        }
    </script>
</body>
</html>
